<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VichirDaily</title>
  <link rel="preload" href="assets/fonts/ui.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="assets/background/background.normal.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="assets/background/background.evil.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="assets/shop/shop_header.png" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-pending">
  <div class="ambient-background" aria-hidden="true">
    <div class="ambient-background-image ambient-background-normal"></div>
    <div class="ambient-background-image ambient-background-evil"></div>
  </div>

  <button id="modeSwitchButton" class="mode-switch-button" type="button" hidden>切换模式</button>
  <button id="devToggleButton" class="dev-toggle-button" type="button">开发者模式</button>

  <main class="ledger" aria-label="VichirDaily 首页">
    <span class="ledger-corner ledger-corner-top-left" aria-hidden="true"></span>
    <span class="ledger-corner ledger-corner-bottom-right" aria-hidden="true"></span>
    <section class="ledger-page ledger-page-left">
      <header class="title-panel">
        <p class="ornament">◆ ◆ ◆</p>
        <h1>VichirDaily</h1>
        <p class="subtitle">大维齐尔日常账簿</p>
      </header>

      <aside class="status-panel" aria-label="状态栏">
        <h2>御前状态</h2>
        <dl class="status-list">
          <div>
            <dt>日期</dt>
            <dd id="dayText">Day 1</dd>
          </div>
          <div>
            <dt>模式</dt>
            <dd id="modeText">通常</dd>
          </div>
          <div>
            <dt>行动力</dt>
            <dd id="actionPointText">3 / 3</dd>
          </div>
          <div>
            <dt class="stat-label" title="勤政">
              <img src="assets/icons/icon_diligence.png" alt="" title="勤政">
              <span class="sr-only">勤政</span>
            </dt>
            <dd id="diligenceText">0</dd>
          </div>
          <div>
            <dt class="stat-label" title="灵视">
              <img src="assets/icons/icon_spirit.png" alt="" title="灵视">
              <span class="sr-only">灵视</span>
            </dt>
            <dd id="visionText">0</dd>
          </div>
          <div>
            <dt class="stat-label" title="财富">
              <img src="assets/icons/icon_wealth.png" alt="" title="财富">
              <span class="sr-only">财富</span>
            </dt>
            <dd id="goldText">0</dd>
          </div>
          <div id="madnessRow" hidden>
            <dt class="stat-label" title="疯狂">
              <img src="assets/icons/action_crazy.png" alt="" title="疯狂">
              <span class="sr-only">疯狂</span>
            </dt>
            <dd id="madnessText">0</dd>
          </div>
        </dl>
      </aside>
    </section>

    <section class="ledger-page ledger-page-right">
      <div class="main-grid">
        <section class="action-panel" aria-label="行动区">
          <h2>今日谕令</h2>
          <div class="action-list" id="actionList"></div>
        </section>

        <section class="log-panel" aria-label="日志区">
          <h2>宫廷日志</h2>
          <div id="todayLog" class="log-text" aria-live="polite">今日尚未行动</div>
        </section>
      </div>

      <footer class="ledger-footer">
        <button id="historyButton" class="history-button ledger-control-button" type="button">历史日志</button>
        <button id="shopButton" class="ledger-control-button" type="button">商店</button>
        <button id="appearanceButton" class="ledger-control-button" type="button">装扮</button>
        <button id="saveButton" class="ledger-control-button" type="button">保存游戏</button>
        <button id="clearSaveButton" class="ledger-control-button ledger-control-button-ghost" type="button">清除存档</button>
      </footer>

      <section id="historyPanel" class="history-panel" aria-label="历史日志" hidden>
        <h2>历史日志</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </section>
  </main>

  <div id="startModal" class="start-modal" role="dialog" aria-modal="true" aria-labelledby="startTitle" hidden>
    <div class="mode-backdrop"></div>
    <section class="mode-card">
      <p class="mode-kicker">VichirDaily</p>
      <h2 id="startTitle">要从哪里开始？</h2>
      <div class="mode-options">
        <button class="mode-option" id="continueButton" type="button">继续游戏</button>
        <button class="mode-option" id="restartButton" type="button">重新开始</button>
      </div>
    </section>
  </div>

  <div id="modeModal" class="mode-modal" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
    <div class="mode-backdrop"></div>
    <section class="mode-card">
      <p class="mode-kicker">选择化身</p>
      <h2 id="modeTitle">今天选择什么姿态打工？</h2>
      <div class="mode-options">
        <button class="mode-option" type="button" data-mode-choice="normal">
          <span>普通</span>
        </button>
        <button class="mode-option mode-option-evil" type="button" data-mode-choice="evil">
          <span>邪恶化身</span>
        </button>
      </div>
    </section>
  </div>

  <div id="eventModal" class="event-modal" role="dialog" aria-modal="true" aria-labelledby="eventTitle" hidden>
    <div class="event-backdrop"></div>
    <section class="event-card">
      <div class="event-decor" aria-hidden="true">
        <span class="event-decor-piece event-decor-large"></span>
        <span class="event-decor-piece event-decor-small"></span>
        <span class="event-decor-piece event-decor-leaf"></span>
      </div>
      <p id="eventImageSlot" class="event-image-slot" aria-hidden="true"></p>
      <h2 id="eventTitle">事件标题</h2>
      <p id="eventBody" class="event-body">事件正文</p>
      <div id="eventRewards" class="event-rewards"></div>
      <div id="eventOptions" class="event-options"></div>
      <button id="eventConfirmButton" class="event-confirm-button" type="button">确定</button>
    </section>
  </div>

  <div id="dayEndModal" class="event-modal day-end-modal" role="dialog" aria-modal="true" aria-labelledby="dayEndTitle" hidden>
    <div class="event-backdrop"></div>
    <section class="event-card">
      <div class="event-decor" aria-hidden="true">
        <span class="event-decor-piece event-decor-large"></span>
        <span class="event-decor-piece event-decor-small"></span>
        <span class="event-decor-piece event-decor-leaf"></span>
      </div>
      <h2 id="dayEndTitle">日终结算</h2>
      <div id="dayEndBody" class="day-end-body"></div>
      <button id="nextDayButton" class="event-confirm-button" type="button">进入下一天</button>
    </section>
  </div>

  <div id="shopModal" class="shop-modal" role="dialog" aria-modal="true" aria-labelledby="shopTitle" hidden>
    <div class="shop-backdrop"></div>
    <section class="shop-window">
      <div class="shop-header" aria-hidden="true"></div>
      <div class="shop-title-row">
        <h2 id="shopTitle">商店</h2>
        <p>挑选你需要的物品吧。</p>
      </div>
      <div id="shopGrid" class="shop-grid"></div>
      <footer class="shop-footer">
        <p class="shop-gold">当前金币：<span id="shopGoldText">0</span></p>
        <button id="shopCloseButton" class="ledger-control-button" type="button">关闭</button>
      </footer>
    </section>
  </div>

  <div id="appearanceModal" class="appearance-modal" role="dialog" aria-modal="true" aria-labelledby="appearanceTitle" hidden>
    <div class="appearance-backdrop"></div>
    <section class="appearance-window">
      <header class="appearance-header">
        <div>
          <p class="appearance-kicker">宫廷衣橱</p>
          <h2 id="appearanceTitle">装扮</h2>
        </div>
        <button id="appearanceCloseButton" class="ledger-control-button ledger-control-button-ghost" type="button">关闭</button>
      </header>
      <nav id="appearanceTabs" class="appearance-tabs" aria-label="切换角色"></nav>
      <div id="appearanceContent" class="appearance-content"></div>
    </section>
  </div>

  <aside id="devPanel" class="dev-panel" aria-label="开发者模式" hidden>
    <h2>开发者模式</h2>
    <div class="dev-panel-grid">
      <button type="button" data-dev-action="diligence">勤政 +1</button>
      <button type="button" data-dev-action="vision">灵视 +1</button>
      <button type="button" data-dev-action="gold">金币 +1</button>
      <button class="evil-only" type="button" data-dev-action="madness">疯狂 +1</button>
      <button type="button" data-dev-action="restore-ap">行动力恢复到3</button>
      <button type="button" data-dev-action="next-day">直接进入下一天</button>
      <button type="button" data-dev-action="sultan-1">触发【苏丹的奖励Ⅰ】</button>
      <button type="button" data-dev-action="fluffy">触发【毛茸茸之约】</button>
      <button class="evil-only" type="button" data-dev-action="abyss">触发【深渊的邀请】</button>
      <button type="button" data-dev-action="reset-save">清空存档并回到模式选择</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
